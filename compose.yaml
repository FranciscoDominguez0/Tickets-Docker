version: "3.8"

services:

  web:
    build: .
    container_name: php_app
    restart: always

    ports:
      - "8080:80"

    depends_on:
      - db

    volumes:
      # Adjuntos y PDFs de tickets
      - ./app/sistema-tickets/upload/uploads/attachments:/var/www/html/sistema-tickets/upload/uploads/attachments
      # Firmas digitales
      - ./app/sistema-tickets/firmas:/var/www/html/sistema-tickets/firmas

  db:
    image: mysql:8.0
    container_name: mysql_app
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: AdminV_RootPass2026!

      MYSQL_DATABASE: tickets_db

      MYSQL_USER: AdminV
      MYSQL_PASSWORD: Panama2626.

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_app
    restart: always

    ports:
      - "127.0.0.1:8081:80"

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: AdminV_RootPass2026!

    depends_on:
      - db

volumes:
  db_data: